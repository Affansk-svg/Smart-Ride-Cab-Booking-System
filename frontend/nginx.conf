server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API gateway: single origin for the browser, routes to each microservice
  location /api/users    { proxy_pass http://user-service:8081; proxy_set_header Host $host; }
  location /api/rides    { proxy_pass http://ride-service:8082; proxy_set_header Host $host; }
  location /api/payments { proxy_pass http://payment-service:8083; proxy_set_header Host $host; }

  # WebSocket / SockJS for live tracking
  location /ws {
    proxy_pass http://ride-service:8082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
