server:
  port: 8082
spring:
  application:
    name: ride-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ride_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
app:
  jwt:
    secret: ${JWT_SECRET:smart-ride-super-secret-key-change-me-0123456789}
    expiration-ms: 86400000
